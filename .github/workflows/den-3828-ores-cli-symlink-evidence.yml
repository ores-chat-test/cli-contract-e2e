name: DEN-3828 ores-cli contract evidence symlink certificate

on:
  pull_request:
    paths:
      - '.github/workflows/den-3828-ores-cli-symlink-evidence.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/den-3828-ores-cli-symlink-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-3828-ores-cli-symlink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_REVISION: 3ee638eb18f724e1d6a6f42d58fd4a2fa59587dc

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact public test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: certificate
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact test revision
        working-directory: certificate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORES_CLI_REVISION }}
          path: ores-cli-candidate
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact candidate revision and source scope
        working-directory: ores-cli-candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORES_CLI_REVISION"
          grep -F '"contract-evidence-symlink"' src/audit/contract_generated_evidence.rs
          grep -F 'rejects_symlinked_schema_b_aliasing_authored_schema_a' src/audit/contract_generated_evidence.rs

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Verify committed dependency graph
        working-directory: ores-cli-candidate
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check exact candidate formatting
        working-directory: ores-cli-candidate
        run: cargo fmt --all --check

      - name: Run focused contract generated-evidence regressions
        working-directory: ores-cli-candidate
        run: cargo test --locked contract_generated_evidence

      - name: Run strict Clippy on exact candidate
        working-directory: ores-cli-candidate
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Prove peer-authority wording remains intact
        working-directory: ores-cli-candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'TypeSpec and independently authored' src/audit/contract_generated_evidence.rs
          grep -F 'comparison-only JSON Schema B' src/audit/contract_generated_evidence.rs
          grep -F 'compare B with authored JSON Schema A' src/audit/contract_generated_evidence.rs

      - name: Retain exact-source certificate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/den-3828-symlink-certificate"
          printf '%s\n' "$ORES_CLI_REVISION" > "$RUNNER_TEMP/den-3828-symlink-certificate/ores-cli-revision.txt"
          sha256sum ores-cli-candidate/src/audit/contract_generated_evidence.rs > "$RUNNER_TEMP/den-3828-symlink-certificate/contract-generated-evidence.sha256"

      - name: Upload bounded certificate
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-3828-ores-cli-symlink-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/den-3828-symlink-certificate/
          if-no-files-found: warn
          retention-days: 30
