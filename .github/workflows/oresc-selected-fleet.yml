name: ORESC selected-fleet contract

on:
  pull_request:
    paths:
      - "contracts/oresc-selected-fleet.v1.json"
      - "contracts/oresc-selected-fleet.v1.tsp"
      - "contracts/oresc-selected-fleet.v1.schema.json"
      - "contracts/instances/**"
      - "scripts/verify-oresc-selected-fleet.mjs"
      - "suite.json"
      - "README.md"
      - ".github/workflows/oresc-selected-fleet.yml"
  push:
    branches: [main]
    paths:
      - "contracts/oresc-selected-fleet.v1.json"
      - "contracts/oresc-selected-fleet.v1.tsp"
      - "contracts/oresc-selected-fleet.v1.schema.json"
      - "contracts/instances/**"
      - "scripts/verify-oresc-selected-fleet.mjs"
      - "suite.json"
      - "README.md"
      - ".github/workflows/oresc-selected-fleet.yml"
  workflow_dispatch:
    inputs:
      ores_cli_ref:
        description: "ORESoftware/ores-cli ref to verify"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: oresc-selected-fleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact test contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: ""
      - name: Enforce independent TypeSpec and JSON Schema authorities with TJSV
        uses: ORESoftware/typespec-json-schema-validator@6bb5b7c1ee41c8b43741e50a264c33a1165549c4
        with:
          typespec: contracts/oresc-selected-fleet.v1.tsp
          schema: contracts/oresc-selected-fleet.v1.schema.json
          instances: contracts/instances
          report: .typespec-json-schema-validator/oresc-selected-fleet.report.json
          sarif: .typespec-json-schema-validator/oresc-selected-fleet.sarif
          contract_ir: .typespec-json-schema-validator/oresc-selected-fleet.contract-ir.json
          quiet: "false"
      - name: Require admissible differential evidence
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const report = JSON.parse(readFileSync('.typespec-json-schema-validator/oresc-selected-fleet.report.json', 'utf8'));
          const contractIr = JSON.parse(readFileSync('.typespec-json-schema-validator/oresc-selected-fleet.contract-ir.json', 'utf8'));
          const differential = report.differential?.summary;
          if (report.schema !== 'ores.typespec-json-schema-validator.report/v1') throw new Error('unexpected TJSV report schema');
          if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true) throw new Error('TJSV parity did not pass');
          if (
            report.coverage?.differentialInstanceValidation !== true
            || report.differential?.disabled === true
            || !differential
            || differential.probesEvaluated < 1
            || differential.divergences !== 0
            || differential.refusals !== 0
          ) {
            throw new Error('TJSV differential evidence is incomplete');
          }
          if (contractIr.schema !== 'ores.typespec-json-schema-validator.contract-ir/v1') throw new Error('unexpected Contract IR schema');
          if (contractIr.status !== 'passed' || contractIr.admissible !== true || contractIr.admission?.scope?.complete !== true) {
            throw new Error('Contract IR is not admissible');
          }
          NODE
      - name: Validate contract values and negative controls
        run: |
          set -euo pipefail
          node scripts/verify-oresc-selected-fleet.mjs --self-test
          node scripts/verify-oresc-selected-fleet.mjs
          python3 -m json.tool contracts/oresc-selected-fleet.v1.json >/dev/null
      - name: Reject credentials and conflict markers
        run: |
          set -euo pipefail
          if grep -RInE '^(<{7}|={7}|>{7})( |$)' --exclude-dir=.git --exclude-dir=.typespec-json-schema-validator .; then
            echo "unresolved conflict marker found" >&2
            exit 1
          fi
          if grep -RInE '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~-]{20,})' \
              --exclude-dir=.git --exclude-dir=.typespec-json-schema-validator .; then
            echo "credential-shaped value found" >&2
            exit 1
          fi
      - name: Retain deterministic TJSV evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oresc-selected-fleet-tjsv-${{ github.run_id }}
          path: .typespec-json-schema-validator
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  private-source:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the approved private-source read credential
        env:
          ORES_CLI_READ_TOKEN: ${{ secrets.ORES_CLI_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ORES_CLI_READ_TOKEN:-}" || {
            echo "ORES_CLI_READ_TOKEN is required for private-source verification" >&2
            exit 2
          }
      - name: Check out test contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: ""
      - name: Check out reviewed ores-cli source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ inputs.ores_cli_ref }}
          token: ${{ secrets.ORES_CLI_READ_TOKEN }}
          path: upstream/ores-cli
          persist-credentials: false
      - name: Verify the exact private script against this independent contract
        run: |
          set -euo pipefail
          node scripts/verify-oresc-selected-fleet.mjs \
            --script upstream/ores-cli/reconcile-selected-orgs.sh
          bash -n upstream/ores-cli/reconcile-selected-orgs.sh
          bash upstream/ores-cli/tests/reconcile_selected_orgs.sh
      - name: Verify clone-install handoff remains non-mutating
        run: |
          set -euo pipefail
          upstream/ores-cli/post-install.sh --dry-run > "$RUNNER_TEMP/post-install.txt"
          grep -F 'reconcile-selected-orgs.sh --apply --production-only' "$RUNNER_TEMP/post-install.txt"
          grep -F 'reconcile-selected-orgs.sh --apply --tests-only' "$RUNNER_TEMP/post-install.txt"
