name: DEN-3830 TJSV language boundary hardening

on:
  pull_request:
    paths:
      - '.github/workflows/den-3830-language-boundary-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-3830-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TJSV_REVISION: 733bc1b6b4b45433a38625fc4dd9ddb108b60519
    steps:
      - name: Check out exact test-repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: consumer
          persist-credentials: false

      - name: Verify test-repository revision
        working-directory: consumer
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out public TJSV at the reviewed exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_REVISION }}
          path: public-tjsv
          persist-credentials: false

      - name: Verify upstream revision
        working-directory: public-tjsv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TJSV_REVISION"

      - name: Set up supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: public-tjsv/package-lock.json

      - name: Install immutable dependencies
        working-directory: public-tjsv
        run: npm ci

      - name: Run focused boundary and schema-execution tests
        working-directory: public-tjsv
        shell: bash
        run: |
          set -euo pipefail
          node --test ./test/unit/language-boundary*.test.mjs

      - name: Run complete compiler-backed upstream suite
        working-directory: public-tjsv
        run: npm run test:all

      - name: Verify public package contents and immutable sources
        working-directory: public-tjsv
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run
          git diff --exit-code -- package.json package-lock.json src schema test
